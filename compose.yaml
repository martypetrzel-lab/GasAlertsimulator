services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gasalert
      POSTGRES_USER: gasalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasalert -d gasalert"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
